<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Browser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui; }
  </style>
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col">
  <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-xl">G</div>
      <h1 class="text-xl font-bold">Grok Browser</h1>
    </div>
    <button onclick="openSettings()" class="p-2 hover:bg-zinc-800 rounded-xl">⚙️</button>
  </div>
  
  <div id="chat" class="flex-1 overflow-auto p-4 space-y-4"></div>
  
  <div class="p-4 border-t border-zinc-800">
    <div class="flex gap-2">
      <input id="input" type="text" placeholder="Ask Grok to help with this page..." 
             class="flex-1 bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-indigo-500">
      <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 px-6 rounded-2xl">Send</button>
    </div>
    <button onclick="teachGrok()" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded-2xl text-sm">Teach Grok something new</button>
  </div>
</body>
<script src="sidebar.js"></script>
</html>
